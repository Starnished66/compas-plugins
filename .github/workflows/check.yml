name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Lua 5.5.1 (lua and luac)
        run: .github/scripts/setup-lua.sh
      - name: Compile every plugin
        run: find plugins -name '*.lua' -print0 | xargs -0 -n1 luac -p
      - name: Test API 15 music plugins
        run: lua tests/music_plugins/run.lua
      - name: Test API 15 ListenBrainz and Net Radio plugins
        run: lua tests/service_plugins/run.lua
      - name: Test Lock Screen persistence and Kids Mode
        run: |
          lua tests/lockscreen_storage_test.lua
          lua tests/kids_mode_test.lua
      - name: Test API 16 v1.1 plugins
        run: |
          lua tests/track_inspector/run.lua
          lua tests/volume_plugins/run.lua
          lua tests/context_plugins/run.lua
          lua tests/ab_plugins/run.lua
          lua tests/jellyfin_emby/run.lua
      - name: Test podcast and audiobook speed handoff
        run: lua tests/podcasts_speed_test.lua plugins/Podcasts/Podcasts.lua plugins/Audiobooks/Audiobooks.lua
      - name: Test audiobook shelves and podcast offline workflows
        run: lua tests/workflow_shelves_test.lua plugins/Audiobooks/Audiobooks.lua plugins/Podcasts/Podcasts.lua
      - name: Install preview image dependency
        run: python3 -m pip install Pillow==12.3.0
      - name: Validate the store index
        run: python3 tools/build_index.py --check
      - name: Test preview asset generation
        run: python3 -m unittest discover -s tools -p 'test_build_index.py'
