name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Lua 5.5.1 (lua and luac)
        run: .github/scripts/setup-lua.sh
      - name: Compile every plugin
        run: find plugins -name '*.lua' -print0 | xargs -0 -n1 luac -p
      - name: Test listening player layouts
        run: |
          lua tools/test_reading_room_player.lua
          lua tools/test_audiobooks_player_layout.lua
          lua tools/test_podcasts_player_layout.lua
      - name: Install preview image dependency
        run: python3 -m pip install Pillow==12.3.0
      - name: Validate the store index
        run: python3 tools/build_index.py --check
